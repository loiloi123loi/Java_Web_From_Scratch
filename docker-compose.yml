services:
  db:
    image: mysql:9.1.0
    container_name: smart_class_db
    environment:
      MYSQL_DATABASE: smart_class_pro
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD:-root_password}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - --default-authentication-plugin=mysql_native_password
      - --initialize-insecure=false
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d

  site-dev:
    image: ${DOCKER_IMAGE_NAME:-smart-class-app}:latest-dev
    build: .
    container_name: smart_class_dev
    ports:
      - "8081:8080"
    environment:
      - APP_ENV=dev
      - DB_URL=jdbc:mysql://db:3306/smart_class_dev
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD:-root_password}
      - JWT_ACCESS_TOKEN_SECRET=${JWT_ACCESS_TOKEN_SECRET}
      - JWT_REFRESH_TOKEN_SECRET=${JWT_REFRESH_TOKEN_SECRET}
      - JWT_EMAIL_VERIFY_TOKEN_SECRET=${JWT_EMAIL_VERIFY_TOKEN_SECRET}
    depends_on:
      db:
        condition: service_healthy

  site-pro:
    image: ${DOCKER_IMAGE_NAME:-smart-class-app}:latest
    build: .
    container_name: smart_class_pro
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=prod
      - DB_URL=jdbc:mysql://db:3306/smart_class_pro
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD:-root_password}
      - JWT_ACCESS_TOKEN_SECRET=${JWT_ACCESS_TOKEN_SECRET}
      - JWT_REFRESH_TOKEN_SECRET=${JWT_REFRESH_TOKEN_SECRET}
      - JWT_EMAIL_VERIFY_TOKEN_SECRET=${JWT_EMAIL_VERIFY_TOKEN_SECRET}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
